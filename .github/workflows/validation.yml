name: Functional test groups

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      group:
        description: "Test group from src/test/groups.json, or all"
        default: all
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Test inventory
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Validate inventory and scripts
        run: |
          bash -n src/test.sh
          bash src/test.sh --check
      - name: Select groups
        id: groups
        env:
          REQUESTED_GROUP: ${{ inputs.group || 'all' }}
        run: |
          if [[ "$REQUESTED_GROUP" == all ]]; then
            groups=$(jq -c 'keys' src/test/groups.json)
          else
            jq -e --arg g "$REQUESTED_GROUP" 'has($g)' src/test/groups.json
            groups=$(jq -cn --arg g "$REQUESTED_GROUP" '[$g]')
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  functional-tests:
    name: Tests / ${{ matrix.group }}
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.inventory.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Run isolated group
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: bash src/test.sh --group "$TEST_GROUP"
      - name: Upload group evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.group }}
          path: src/test-results/${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Go vet and Linux build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false
      - run: go vet ./...
        working-directory: src
      - run: CGO_ENABLED=0 go build -o /tmp/doc-arquitetura ./
        working-directory: src

  charter-docs:
    name: Charter documentation, links, and SVG badges
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check Charter structure and references
        shell: bash
        run: |
          mkdir -p ci-results
          set -o pipefail
          bash .github/scripts/validate-charter.sh 2>&1 | tee ci-results/charter-validation.log
      - name: Upload Charter validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charter-validation-evidence
          path: ci-results/charter-validation.log
          if-no-files-found: warn
          retention-days: 30
